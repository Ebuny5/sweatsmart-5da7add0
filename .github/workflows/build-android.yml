name: Build Android Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions → New):
#
#   KEYSTORE_BASE64      — your .jks / .keystore file encoded as Base64
#                          Generate with: base64 -i your-key.jks | tr -d '\n'
#                          On Windows use: certutil -encode your-key.jks tmp.txt
#                          Then copy the content between -----BEGIN----- lines
#
#   KEYSTORE_PASSWORD    — the keystore password
#   KEY_ALIAS            — the key alias inside the keystore
#   KEY_PASSWORD         — the key password (often same as keystore password)
#
# Until these secrets are added the "Sign AAB" step will fail but
# an unsigned debug AAB will still be uploaded as a fallback artifact.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. JS deps ───────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build web assets ──────────────────────────────────────────────
      - name: Build web (Vite)
        run: npm run build

      # ── 5. Java ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 6. Android SDK ───────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 7. Add Android platform if not present ───────────────────────────
      - name: Add Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── 8. Inject required permissions ───────────────────────────────────
      - name: Patch AndroidManifest.xml permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi

      # ── 9. Capacitor sync ────────────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 10. Gradle executable ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Decode keystore from secret ──────────────────────────────────
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/hidroally-release.jks
          echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV

      # ── 12. Build RELEASE AAB (signed) ───────────────────────────────────
      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_EXISTS == 'true' }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/hidroally-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ── 13. Build DEBUG AAB fallback (no signing secrets yet) ────────────
      - name: Build debug AAB (fallback — no keystore secrets set)
        if: ${{ env.KEYSTORE_EXISTS != 'true' }}
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon
          echo "⚠️ No keystore secrets found — built DEBUG AAB. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secrets to build a signed release AAB."

      # ── 14. Upload signed release AAB ────────────────────────────────────
      - name: Upload signed release AAB
        if: ${{ env.KEYSTORE_EXISTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hidroally-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # ── 15. Upload debug AAB fallback ────────────────────────────────────
      - name: Upload debug AAB (fallback)
        if: ${{ env.KEYSTORE_EXISTS != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hidroally-debug-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 14

      # ── 16. Summary ──────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Android Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          if [ "$KEYSTORE_EXISTS" = "true" ]; then
            echo "✅ **Signed release AAB built** — ready to upload to Google Play" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Debug AAB built** — add your keystore secrets to get a signed release AAB" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Add these GitHub Secrets:" >> $GITHUB_STEP_SUMMARY
            echo "Go to **Settings → Secrets and variables → Actions → New repository secret**" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEYSTORE_BASE64\` — your .jks file encoded as base64" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEYSTORE_PASSWORD\` — keystore password" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEY_ALIAS\` — key alias" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEY_PASSWORD\` — key password" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the AAB from the **Artifacts** section above, then upload to Google Play Console → Production → Create new release." >> $GITHUB_STEP_SUMMARY
